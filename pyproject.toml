[project]
name = "agent-permission-diff-bot"
version = "0.5.0"
description = "Detect and explain agent-facing permission changes in pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
agent-permission-diff = "agent_permission_diff_bot.cli:main"

[dependency-groups]
dev = [
    "mypy==1.20.0",
    "pytest==9.1.1",
    "ruff==0.15.18",
    "types-PyYAML==6.0.12.20250915",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
