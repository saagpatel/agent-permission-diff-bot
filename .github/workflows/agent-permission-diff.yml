name: Agent Permission Diff

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-permission-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permission-diff:
    name: Agent-facing permission diff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan agent-facing permission changes
        uses: ./
        with:
          mode: observe
          fail-on: critical
          json: agent-permission-diff.json
          sarif: agent-permission-diff.sarif
          markdown: agent-permission-diff.md
          step-summary: "true"
          comment: "true"
          upload-sarif: "false"
